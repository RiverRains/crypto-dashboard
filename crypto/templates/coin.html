<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coin Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark border-bottom border-secondary">
    <div class="container py-2 d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-semibold" href="/">← Back</a>
      <div class="d-flex align-items-center gap-3">
        <div class="small text-secondary d-none d-md-block" id="lastUpdatedWrap">
          <span class="text-secondary">Last updated:</span> <span id="lastUpdatedText">—</span>
        </div>
        <span class="badge text-bg-secondary" id="modeBadge">DEMO</span>
        <button class="btn btn-sm btn-outline-light" id="toggleMode" type="button">Switch to LIVE</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="panel p-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <div class="text-secondary small">Coin</div>
          <div class="h4 mb-0" id="coinName">Loading…</div>
          <div class="text-secondary small" id="coinSymbol"></div>
        </div>
        <div class="btn-group btn-group-sm" role="group">
          <button class="btn btn-outline-light range-btn" data-days="7" type="button">7D</button>
          <button class="btn btn-outline-light range-btn active" data-days="30" type="button">30D</button>
          <button class="btn btn-outline-light range-btn" data-days="90" type="button">90D</button>
        </div>
      </div>

      <div class="mt-2 small text-warning d-none" id="coinError"></div>
      <div class="mt-3">
        <canvas id="coinChart" height="120"></canvas>
      </div>

      <div class="mt-3 row g-2 small">
        <div class="col-md-3"><span class="text-secondary">Price (USD):</span> <span id="price">—</span></div>
        <div class="col-md-3"><span class="text-secondary">24h:</span> <span id="ch24">—</span></div>
        <div class="col-md-3"><span class="text-secondary">Market Cap:</span> <span id="cap">—</span></div>
        <div class="col-md-3"><span class="text-secondary">Volume (USD):</span> <span id="vol">—</span></div>
      </div>
      <div class="mt-2 small text-secondary">
        Live refresh: every 30s (LIVE mode only). Live mode: Binance (USDT≈USD).
      </div>
    </div>
  </main>

  <script>window.__COIN_ID__ = "{{ coin_id }}";</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/coin.js"></script>
</body>
</html>
